title = "WebRAD secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Aurora component binding ID, not an API credential (including Git history)"
condition = "AND"
regexTarget = "match"
paths = ['''^examples/aurora-workspace/pages/Data\.(generated\.ts|wrpage)$''']
regexes = ['''apiClientId["']?\s*:\s*["']183e9e9c-2b0e-41af-8a2c-57426be7d213["']''']

[[rules.allowlists]]
description = "SIGAT2 component binding IDs (seeded UUID v4), not API credentials (including Git history)"
condition = "AND"
regexTarget = "match"
paths = ['''^examples/sigat2/pages/[A-Za-z0-9]+\.(generated\.ts|wrpage)$''']
regexes = ['''apiClientId["']?\s*:\s*["'][0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}["']''']
